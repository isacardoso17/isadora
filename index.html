<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css" />
    <title>Conecta Aí</title>
    <link rel="icon" href="https://images.icon-icons.com/2352/PNG/512/connect_icon_143211.png">
</head>
<body>
    <header class="cabecalho">
        <h1>Confere Aí</h1>
        <nav>
            <a href="#" class="cabecalho-link">Inicio</a>
        </nav>
    </header>
    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <section>
        <article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://cdn.baixarmapas.com.br/mapa/brasil/mapa-brasil-estados-e-capitais-8.png" alt="Pinguim" class="cartao-imagem">
                    <p>quantos estados temos no Brasil?</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://static.todamateria.com.br/upload/di/st/distritofederalmapaentorno-cke.jpg" alt="Pinguim"  class="cartao-imagem">
                    <p>26 estados e 1 Distrito Federal, somando 27 unidades federativas.</p>
                </div>
            </div>
        </article>
<article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlfFcX1OA9zEjHPYrZVB_SaCBZTz0n2SiQaJE7-m3COYA55S6OenBiIO_R&s=10" alt="Baleia" class="cartao-imagem">
                    <p>quantos habitantes temos no Sul</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://www.estadosecapitaisdobrasil.com/wp-content/uploads/2015/04/mapa-mundi.png" alt="Baleia"  class="cartao-imagem">
                    <p>cerca de 29,9 milhões de habitantes, segundo os dados oficiais do Censo.</p>
                </div>
            </div>
        </article>

        </section>
    </main>
    <footer>
        <p>Projeto feito por Isadora Cardoso </p>
    </footer>
</body>
</html>
